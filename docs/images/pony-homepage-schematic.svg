<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Pony Computility homepage schematic</title>
  <desc id="desc">A warm, minimal Pony Computility homepage with model provider marks orbiting the gateway.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f3eee5"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#e9a58c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e9a58c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#443a30" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #817970; }
      .ink { fill: #292722; }
      .provider { font-size: 16px; font-weight: 600; fill: #45413b; }
      .card-title { font-size: 16px; font-weight: 650; fill: #38352f; }
      .small { font-size: 13px; fill: #8b847a; }
    </style>
  </defs>

  <rect width="1280" height="860" rx="28" fill="url(#canvas)"/>
  <circle cx="650" cy="310" r="360" fill="url(#halo)"/>

  <!-- Navigation -->
  <g transform="translate(80 48)">
    <circle cx="13" cy="14" r="13" fill="#c7795f"/>
    <path d="M8 15c2-6 8-6 10 0M10 20h6" fill="none" stroke="#fff9f3" stroke-width="1.6" stroke-linecap="round"/>
    <text x="38" y="20" class="ink" font-size="19" font-weight="700" letter-spacing="-.5">Pony Computility</text>
    <text x="560" y="19" class="muted" font-size="14">产品</text>
    <text x="625" y="19" class="muted" font-size="14">模型定价</text>
    <text x="730" y="19" class="muted" font-size="14">文档</text>
    <rect x="1032" y="-5" width="90" height="38" rx="19" fill="#292722"/>
    <text x="1077" y="19" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">登录</text>
    <rect x="1132" y="-5" width="112" height="38" rx="19" fill="#c7795f"/>
    <text x="1188" y="19" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">开始使用</text>
  </g>

  <!-- Hero copy -->
  <g transform="translate(86 198)">
    <rect width="168" height="30" rx="15" fill="#efe7dc"/>
    <circle cx="17" cy="15" r="4" fill="#bd765c"/>
    <text x="30" y="19" fill="#795646" font-size="12" font-weight="650" letter-spacing="1.4">UNIFIED AI GATEWAY</text>
    <text x="0" y="88" class="ink" font-size="54" font-weight="650" letter-spacing="-2.4">One API.</text>
    <text x="0" y="151" class="ink" font-size="54" font-weight="650" letter-spacing="-2.4">Every model.</text>
    <text x="2" y="193" class="muted" font-size="16">把常用大模型接入一个清晰、统一的 API 网关。</text>
    <rect x="0" y="225" width="138" height="46" rx="23" fill="#c7795f"/>
    <text x="69" y="253" text-anchor="middle" fill="#fff" font-size="14" font-weight="650">创建账户　→</text>
    <rect x="150" y="225" width="132" height="46" rx="23" fill="#fbf8f2" stroke="#ded6cb"/>
    <text x="216" y="253" text-anchor="middle" class="ink" font-size="14" font-weight="600">查看定价</text>
  </g>

  <!-- Orbit -->
  <g transform="translate(829 300)">
    <circle r="204" fill="none" stroke="#d9cfc2" stroke-width="1.5" stroke-dasharray="3 9"/>
    <path d="M-181-95A204 204 0 0 1 124-162" fill="none" stroke="#c7795f" stroke-width="2" stroke-linecap="round"/>
    <path d="m125-170 13 7-14 5" fill="#c7795f"/>
    <circle r="163" fill="none" stroke="#e6ddd2" stroke-width="1"/>
    <circle r="133" fill="#fffaf4" stroke="#e8ded2" stroke-width="1" filter="url(#shadow)"/>
    <circle r="107" fill="#f7eee5"/>
    <circle cx="0" cy="-5" r="32" fill="#c7795f"/>
    <path d="M-13-2c5-12 21-12 26 0M-8 11h16" fill="none" stroke="#fffaf4" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="49" text-anchor="middle" class="ink" font-size="20" font-weight="700">Pony</text>
    <text x="0" y="71" text-anchor="middle" class="muted" font-size="11" letter-spacing="1.2">AI GATEWAY</text>

    <g transform="translate(0 -204)">
      <rect x="-59" y="-22" width="118" height="44" rx="22" fill="#fffdf9" stroke="#e5ddd2" filter="url(#shadow)"/>
      <circle cx="-36" cy="0" r="6" fill="#242321"/><text x="-22" y="5" class="provider">OpenAI</text>
    </g>
    <g transform="translate(177 -102)">
      <rect x="-50" y="-22" width="100" height="44" rx="22" fill="#fffdf9" stroke="#e5ddd2" filter="url(#shadow)"/>
      <circle cx="-28" cy="0" r="6" fill="#c77856"/><text x="-14" y="5" class="provider">Claude</text>
    </g>
    <g transform="translate(177 102)">
      <rect x="-53" y="-22" width="106" height="44" rx="22" fill="#fffdf9" stroke="#e5ddd2" filter="url(#shadow)"/>
      <circle cx="-31" cy="0" r="6" fill="#4285f4"/><text x="-17" y="5" class="provider">Gemini</text>
    </g>
    <g transform="translate(0 204)">
      <rect x="-61" y="-22" width="122" height="44" rx="22" fill="#fffdf9" stroke="#e5ddd2" filter="url(#shadow)"/>
      <circle cx="-39" cy="0" r="6" fill="#3446aa"/><text x="-25" y="5" class="provider">DeepSeek</text>
    </g>
    <g transform="translate(-177 102)">
      <rect x="-48" y="-22" width="96" height="44" rx="22" fill="#fffdf9" stroke="#e5ddd2" filter="url(#shadow)"/>
      <circle cx="-26" cy="0" r="6" fill="#7660c5"/><text x="-12" y="5" class="provider">Qwen</text>
    </g>
    <g transform="translate(-177 -102)">
      <rect x="-48" y="-22" width="96" height="44" rx="22" fill="#fffdf9" stroke="#e5ddd2" filter="url(#shadow)"/>
      <circle cx="-26" cy="0" r="6" fill="#6b806e"/><text x="-12" y="5" class="provider">Llama</text>
    </g>
  </g>

  <!-- Product preview cards -->
  <g transform="translate(82 622)">
    <rect width="1116" height="160" rx="22" fill="#fffdf9" stroke="#e8e0d5" filter="url(#shadow)"/>
    <text x="30" y="38" class="card-title">一个入口，管理整个模型栈</text>
    <text x="30" y="62" class="small">连接渠道、配置密钥，并在同一处查看调用与费用。</text>
    <g transform="translate(30 88)">
      <rect width="245" height="48" rx="12" fill="#f8f4ee"/>
      <circle cx="25" cy="24" r="11" fill="#efe0d2"/>
      <path d="M21 24h8M25 20v8" stroke="#a96950" stroke-width="1.7" stroke-linecap="round"/>
      <text x="47" y="21" class="card-title" font-size="13">统一 API</text><text x="47" y="37" class="small">OpenAI 兼容调用</text>
    </g>
    <g transform="translate(290 88)">
      <rect width="245" height="48" rx="12" fill="#f8f4ee"/>
      <circle cx="25" cy="24" r="11" fill="#e6eadf"/>
      <path d="M20 26l4-4 3 3 4-5" fill="none" stroke="#687957" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="21" class="card-title" font-size="13">用量统计</text><text x="47" y="37" class="small">请求、额度与费用</text>
    </g>
    <g transform="translate(550 88)">
      <rect width="245" height="48" rx="12" fill="#f8f4ee"/>
      <circle cx="25" cy="24" r="11" fill="#e6e8ef"/>
      <path d="M21 20h8v8h-8zM23 18h8v8" fill="none" stroke="#66708b" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="47" y="21" class="card-title" font-size="13">渠道管理</text><text x="47" y="37" class="small">密钥、分组与调度</text>
    </g>
    <g transform="translate(810 88)">
      <rect width="276" height="48" rx="12" fill="#f8f4ee"/>
      <circle cx="25" cy="24" r="11" fill="#f0e7d7"/>
      <path d="M20 27h10M20 23h7M20 19h10" stroke="#8e7654" stroke-width="1.6" stroke-linecap="round"/>
      <text x="47" y="21" class="card-title" font-size="13">清晰的管理界面</text><text x="47" y="37" class="small">围绕日常运维整理</text>
    </g>
  </g>

  <text x="82" y="822" class="muted" font-size="12">PONY COMPUTILITY · AI API GATEWAY</text>
  <text x="1198" y="822" text-anchor="end" class="muted" font-size="12">界面示意图</text>
</svg>
